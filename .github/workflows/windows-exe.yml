name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build-standard.txt
      - name: Compile and test data layer
        run: |
          python -m compileall -q device_registry.py
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_core.py
      - name: Build Windows EXE
        shell: pwsh
        run: |
          $arguments = @('--noconfirm', '--clean', '--onefile', '--windowed', '--optimize', '2', '--name', 'DeviceRegistry', '--icon', 'assets/icon.ico', '--add-data', 'assets/icon.png;assets', '--add-data', 'assets/icon.ico;assets', 'device_registry.py')
          python -m PyInstaller @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceRegistry-windows
          path: dist/DeviceRegistry.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeviceRegistry-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          name: Device Registry ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release/DeviceRegistry.exe
          fail_on_unmatched_files: true
