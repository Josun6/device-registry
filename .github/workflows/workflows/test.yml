name: Tests
on:
  push:
  pull_request:

jobs:
  linux-ui-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install tests and optional dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q device_registry.py
      - name: Test UI and data layer
        run: xvfb-run -a python -m pytest -q tests/

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"
      - name: Compile
        run: python -m compileall -q device_registry.py
      - name: Data layer regression tests
        run: python -m pytest -q tests/test_core.py
